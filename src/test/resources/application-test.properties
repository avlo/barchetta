################################ end WebSocket autoconfigure

#logging.level.com.prosilion.barchetta=info
#logging.pattern.console=%msg%n
spring.jpa.show-sql=false

# H2 DB
spring.datasource.url=jdbc:h2:mem:testdb-barchetta;DB_CLOSE_ON_EXIT=TRUE
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.defer-datasource-initialization=true
spring.jpa.hibernate.ddl-auto=create-drop

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:/schema-nostr-h2db.sql

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
