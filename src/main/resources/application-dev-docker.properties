spring.docker.compose.enabled=true
spring.docker.compose.profiles.active=dev
spring.docker.compose.file=docker-compose-dev.yml

# wss autoconfigure
server.ssl.enabled=true
server.port=8080
server.ssl.bundle=server
spring.ssl.bundle.jks.server.key.alias=localhost
spring.ssl.bundle.jks.server.keystore.location=classpath:localhost.p12
spring.ssl.bundle.jks.server.keystore.password=changeit
spring.ssl.bundle.jks.server.keystore.type=PKCS12

spring.jpa.show-sql=true

### docker MySQL DB
# container running superconductor, needs resolution
nostr.relay.uri=wss://127.0.0.1:5555
spring.datasource.url=jdbc:mysql://barchetta-mysqldb:3326/barchetta

# ----- common below
spring.datasource.username=mysqluser
spring.datasource.password=mysqluserpass

spring.jpa.defer-datasource-initialization=true
spring.jpa.hibernate.ddl-auto=create-drop

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
#spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

spring.sql.init.mode=always

