<!DOCTYPE html>
<html xmlns:sec="https://www.thymeleaf.org/thymeleaf-extras-springsecurity5">
<head>
  <meta http-equiv="Content-Type" content="text/html;charset=utf-8" />
  <title>Edit User</title>
  <link rel="stylesheet" th:href="@{/css/simple.css}"/>
</head>
<body>
<header>Edit User</header>
<main>
  <a href="https://127.0.0.1:8080/contract/display_all">display all</a>
  <b>User:</b> <span sec:authentication="principal.username"/>
  <b>Role(s):</b> <span sec:authentication="principal.authorities"/>

  <form action="#" th:action="@{/edit}" th:object="${user}" method="post">
    <p>
      <label>User Nostr Public Key</label>
      <input type="text" id="nostrPubKey" placeholder="User Pubkey" name="nostrPubKey" th:value="${user.nostrPubKey}">
    </p>
    <input type="hidden" id="user_id" name="user_id" th:value="${user.id}"/>
    <input type="submit" value="Save">
  </form>
</main>
<footer>
  <p>Powered by Presto Security</p>
</footer>
</body>
</html>
