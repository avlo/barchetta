<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="en">
<head>
  <meta http-equiv="Content-Type" content="text/html;charset=utf-8"/>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <link rel="stylesheet" th:href="@{/css/simple.css}"/>
  <link rel="stylesheet" th:href="@{/css/tablestyles.css}"/>
  <title>Contract Preview</title>
</head>
<main>
  <a href="https://localhost:8080/contract/display_all">display all</a>
  <h4 id="sec_user">User: <code class="language-plaintext highlighter-rouge"><span
      sec:authentication="principal.username"></span></code>&emsp;Role(s): <code
      class="language-plaintext highlighter-rouge"><span
      sec:authentication="principal.authorities"></span></code></h4>
  <section>
    <h4>Apply for Contract</h4>
    <form action="#" th:action="@{/contract/apply/{id}(id=${contractDto.id})}" method="post">
      <table style="width:90%">
        <thead>
        <tr>
          <th>AppUserID</th>
          <th>Creator Role</th>
          <th>Contract Text</th>
          <th>PubKey</th>
        </tr>
        </thead>
        <tbody>
        <tr>
          <td th:text="${contractDto.appUserId}"/>
          <td th:text="${contractDto.role}"/>
          <td th:text="${contractDto.text}"/>
          <td th:text="${contractDto.nostrAppUserPubKey}"/>
        </tr>
        </tbody>
      </table>
      <button th:type="submit" class="button">Accept Contract (Preview page)</button>
    </form>
  </section>
</main>
<footer>
  <p>Powered by Presto Security</p>
</footer>
</html>
